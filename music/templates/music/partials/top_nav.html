{% load static %}
<nav class="h-16 flex items-center justify-between px-8 bg-background-glass backdrop-blur-md border-b border-border-main z-50 shadow-sm">
    <div class="flex-1 max-w-xl relative mr-4 md:mr-8">
            <form action="{% url 'music:album_list' %}" method="get" class="w-full relative">
                <button type="submit" class="absolute inset-y-0 left-0 pl-4 flex items-center text-text-muted hover:text-primary focus:outline-none transition-colors duration-300 z-10 cursor-pointer" title="Szukaj" aria-label="Szukaj">
                    {% include "music/partials/icons.html" with icon="search" classes="w-5 h-5" %}
                </button>
            
            <input type="text" 
                id="search-input" 
                name="q" 
                value="{{ query|default:'' }}" 
                placeholder="Szukaj..." 
                autocomplete="off"
                data-url="{% url 'music:search_autocomplete' %}"
                class="w-full bg-background-card hover:bg-white/10 border border-white/10 text-text-main text-sm rounded-2xl pl-12 pr-4 md:pr-12 py-2.5 outline-none focus:border-primary/50 focus:ring-4 focus:ring-primary/10 backdrop-blur-xl transition-all duration-300 placeholder-text-muted shadow-2xl">
                
            <div id="search-results-dropdown" class="hidden absolute top-full left-0 right-0 mt-3 bg-background-glass backdrop-blur-2xl border border-border-main rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] z-[100] overflow-hidden max-h-[480px] overflow-y-auto custom-scrollbar">
            </div>
        </form>
    </div>

    <div class="flex items-center gap-2 md:gap-4 shrink-0 ml-auto">
        <!-- Theme Toggle (Hidden for now) -->
        <button id="theme-toggle" class="hidden p-2.5 rounded-xl bg-background-card border border-border-main text-text-secondary hover:text-primary hover:border-primary/30 transition-all shadow-sm" title="Przełącz motyw" aria-label="Przełącz motyw">
            <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464a1 1 0 10-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>

        <script>
            var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            /* 
               Temporary disabled Light Mode auto-detection
               To restore: uncomment the logic below and remove the forced dark mode.
            */
            
            // Forced Dark Mode for now
            document.documentElement.classList.remove('light-theme');
            if (themeToggleDarkIcon) themeToggleDarkIcon.classList.remove('hidden');
        </script>

        {% if user.is_authenticated %}
            <div class="relative">
                <button onclick="toggleProfileMenu(event)" class="flex items-center gap-2 bg-background-element pl-2 pr-3 py-1.5 rounded-full border border-border-main hover:bg-white/5 transition-colors focus:outline-none shadow-sm" aria-label="Menu profilu">
                    <img src="{{ user.profile.avatar_url }}" alt="Awatar" class="w-7 h-7 rounded-full border border-border-light object-cover">
                    <span class="text-text-secondary text-xs hidden lg:block font-bold">{{ user.username }}</span>
                    {% include "music/partials/icons.html" with icon="chevron-down" classes="w-3 h-3 text-text-muted" %}
                </button>
                <div id="profile-menu" class="hidden absolute right-0 mt-3 w-52 bg-background-surface border border-border-main backdrop-blur-xl rounded-2xl shadow-2xl z-[100] overflow-hidden">
                    <div class="py-2">
                        <a href="{% url 'music:profile' %}" class="px-4 py-3 text-sm text-text-secondary hover:bg-background-element flex items-center gap-3">Mój Profil</a>
                        <div class="border-t border-border-main my-1"></div>
                        <form method="post" action="{% url 'music:logout' %}" class="w-full m-0">
                            {% csrf_token %}
                            <button type="submit" class="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-background-element flex items-center gap-3">Wyloguj się</button>
                        </form>
                    </div>
                </div>
            </div>
        {% else %}
            <div class="flex items-center gap-3">
                <a href="{% url 'music:login' %}" 
                   class="text-sm text-text-secondary hover:text-text-main font-bold px-4 py-2 rounded-xl hover:bg-background-element transition-all">
                    Zaloguj się
                </a>
                
                <a href="{% url 'music:signup' %}" 
                   class="text-sm bg-primary hover:bg-primary/90 text-background-main px-6 py-2.5 rounded-xl font-black shadow-lg shadow-primary/20 transition-all active:scale-95">
                    Załóż konto
                </a>
            </div>
        {% endif %}
    </div>
</nav>
