<section id="genres-section">
    <div class="flex justify-between items-end mb-8">
        <h2 class="text-3xl font-black text-text-main">Odkrywaj wg gatunku</h2>
        {% if genres|length > 5 %}
            <button id="toggle-genres" onclick="toggleGenres()" class="text-primary font-bold hover:text-primary-hover transition-colors">Pokaż wszystkie</button>
        {% endif %}
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6" id="genres-grid">
        {% for genre in genres %}
            <a href="{% url 'music:album_list' %}?genre={{ genre.id }}" class="genre-card relative h-40 rounded-2xl overflow-hidden group shadow-lg border border-border-main {% if forloop.counter > 5 %}hidden{% endif %}">
                <div class="absolute inset-0">
                    {% if genre.image %}
                        <img src="{{ genre.image.url }}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    {% else %}
                        <div class="w-full h-full bg-gradient-to-br from-purple-900 to-gray-900"></div>
                    {% endif %}
                    <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                </div>
                <div class="relative h-full flex items-center justify-center p-4">
                    <span class="text-white font-black text-2xl drop-shadow-lg">{{ genre.name }}</span>
                </div>
            </a>
        {% endfor %}
    </div>
</section>
