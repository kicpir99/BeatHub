<div id="bulk-action-bar" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-background-glass backdrop-blur-2xl border border-border-main px-8 py-4 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.2)] z-[100] flex items-center gap-8 animate-in fade-in slide-in-from-bottom-10 duration-300">
    <div class="flex items-center gap-3 pr-8 border-r border-border-main">
        <span id="selected-count" class="bg-primary text-text-main w-8 h-8 rounded-full flex items-center justify-center font-black text-sm shadow-lg">0</span>
        <span class="text-sm font-bold text-text-secondary uppercase tracking-widest">Wybrano</span>
    </div>
    
    <div class="flex items-center gap-4">
        <button id="bulk-like-btn" onclick="window.handleBulkLike()" class="flex items-center gap-2 px-4 py-2 bg-background-card hover:bg-background-element border border-border-main rounded-xl text-sm font-bold text-text-main transition-all" aria-label="Polub zaznaczone utwory">
            {% include "music/partials/icons.html" with icon="like" classes="w-4 h-4 text-red-500" active=True %}
            Polub wybrane
        </button>

        <button id="bulk-unlike-btn" onclick="window.handleBulkUnlike()" class="hidden items-center gap-2 px-4 py-2 bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 rounded-xl text-sm font-bold text-red-400 transition-all" aria-label="Odlub zaznaczone utwory">
            {% include "music/partials/icons.html" with icon="like" classes="w-4 h-4" active=True %}
            Odlub wybrane
        </button>
        
        <button onclick="window.handleBulkAddToPlaylist()" class="flex items-center gap-2 px-4 py-2 bg-background-card hover:bg-background-element border border-border-main rounded-xl text-sm font-bold text-text-main transition-all" aria-label="Dodaj zaznaczone do playlisty">
            {% include "music/partials/icons.html" with icon="plus" classes="w-4 h-4 text-primary" %}
            Dodaj do playlisty
        </button>

        <button id="bulk-remove-btn" onclick="window.handleBulkRemoveFromPlaylist()" class="hidden items-center gap-2 px-4 py-2 bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 rounded-xl text-sm font-bold text-red-400 transition-all" aria-label="Usuń zaznaczone utwory">
            {% include "music/partials/icons.html" with icon="trash" classes="w-4 h-4" %}
            Usuń zaznaczone
        </button>

        <button onclick="window.clearSelection()" class="text-xs font-bold text-text-muted hover:text-text-main uppercase tracking-widest px-4 transition-colors">
            Anuluj
        </button>
    </div>
</div>
