name: Keep Render Service Awake

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz/ endpoint
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "RENDER_APP_URL repository variable is not set; skipping ping."
            exit 0
          fi
          TARGET="${RENDER_APP_URL%/}/healthz/"
          echo "Pinging $TARGET"
          curl -fsS --max-time 60 "$TARGET"
